historyTitle: Kashiani G.C. Pilot High School
historyContent: >-
  Kashiani G.C. Pilot High School, established in 1902, has long stood as a
  pillar of education in the Kashiani region of Gopalganj. Founded with a vision
  to spread knowledge and shape young minds, the school has played a vital role
  in nurturing generations of students with strong values, discipline, and
  ambition.


  From its early days, the institution grew through the dedication of passionate
  teachers and the unwavering support of the local community. What began as a
  modest initiative gradually evolved into one of the most respected educational
  institutions in the area. Over the years, the school has not only focused on
  academic excellence but also encouraged cultural, social, and moral
  development among its students.


  Thousands of students have passed through its classrooms, carrying forward the
  lessons, memories, and spirit of the school into different walks of life.
  Today, Kashiani G.C. Pilot High School continues its journey with
  pride—honoring its rich legacy while inspiring future generations to dream
  bigger and achieve more.
